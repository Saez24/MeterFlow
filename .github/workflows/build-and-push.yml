# Builds the three deploy images, scans each with Trivy (blocks on HIGH/CRITICAL,
# security-standards §10/§11), and only then pushes to GHCR.
#
# SECURITY (security-standards §11): pin every `uses:` action to a commit SHA
# before production (WS5/Elena hardening task). Registry auth uses the built-in
# GITHUB_TOKEN — no plaintext credentials.
name: build-and-push

on:
  push:
    branches: [production]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [fullstack, backend, frontend]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name (lowercase)
        id: img
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Build image (load locally, no push yet)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.image }}
          load: true
          push: false
          tags: ${{ steps.img.outputs.ref }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (block on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.img.outputs.ref }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          # ACCEPTED TRADEOFF (security-standards §12): ignore-unfixed keeps the
          # push from being blocked by CVEs with no upstream fix (noise). Routine
          # builds still block on any fixable HIGH/CRITICAL. Consider a scheduled
          # non-ignore-unfixed scan that only alerts, to keep unfixed CVEs visible.
          ignore-unfixed: true
          exit-code: '1'

      - name: Push (SHA tag + latest)
        run: |
          docker push "${{ steps.img.outputs.ref }}:${{ github.sha }}"
          docker tag "${{ steps.img.outputs.ref }}:${{ github.sha }}" "${{ steps.img.outputs.ref }}:latest"
          docker push "${{ steps.img.outputs.ref }}:latest"
