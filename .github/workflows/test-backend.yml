# SECURITY (security-standards §11): every `uses:` action is pinned by commit SHA
# (tag kept as a comment). Bump via Dependabot / pin-github-action.
name: test-backend

on:
  push:
    branches: [production]
    paths:
      - 'backend/**'
      - '.github/workflows/test-backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/test-backend.yml'

permissions:
  contents: read

concurrency:
  group: test-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: pip

      - name: Install (runtime + dev deps)
        run: pip install ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Black (format check)
        run: black --check .

      - name: Mypy (strict)
        run: mypy apps config tests

      - name: Bandit (security lint)
        run: bandit -q -r apps config

      - name: pip-audit (dependency CVEs)
        run: pip-audit

      - name: Pytest (+ coverage)
        run: pytest --cov=apps --cov-report=term-missing --alluredir=allure-results
