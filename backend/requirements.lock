# Pinned runtime dependency lock for reproducible, scannable image builds.
#
# The source of truth for WHICH packages we depend on stays in pyproject.toml
# with OPEN ranges (project policy: install latest, don't cap). This file only
# pins the RESOLVED versions so a rebuild installs exactly what was tested and
# Trivy/pip-audit scan a known set. It is consumed by the Dockerfiles
# (`pip install -r requirements.lock`).
#
# Regenerate after bumping deps (picks up latest):
#   python3 -m venv /tmp/lockenv && /tmp/lockenv/bin/pip install ./backend \
#     && /tmp/lockenv/bin/pip freeze | grep -viE '^meterflow-backend' \
#     > backend/requirements.lock   # then re-add this header
