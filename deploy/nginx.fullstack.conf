# Deploy mode C — nginx fronts the Angular SPA and proxies /api → gunicorn.
limit_req_zone $binary_remote_addr zone=auth:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;

server {
    listen 80;
    server_name localhost;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 11m;   # reading photos ≤ 10 MiB + headroom

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    # text/html is always gzipped implicitly — listing it warns "duplicate MIME type".
    gzip_types text/css text/plain application/javascript application/json
        application/xml image/svg+xml font/woff2 application/wasm;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id'; style-src 'self' 'nonce-$request_id'; worker-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Auth endpoints — strict rate limiting (brute-force protection).
    location /api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Set-Cookie;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # General API — rate limiting.
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Set-Cookie;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # Django admin is intentionally NOT exposed: no /admin/ or /django-static/
    # location, so those paths fall through to the SPA below. The admin route
    # still exists in Django (config/urls.py) but is unreachable via this proxy
    # (attack-surface reduction). Re-add both locations to enable it again.

    # NB: reading photos are NOT served from a public /media path. They go through
    # the authenticated, ownership-checked API endpoint
    # GET /api/v1/readings/{id}/photo/ (proxied above), so no /media location
    # exists here (security-standards §4).

    # SPA: inject the per-request CSP nonce, then serve index.html.
    location / {
        sub_filter '__CSP_NONCE__' '$request_id';
        sub_filter_once off;
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed static assets; repeat security headers (nginx resets them).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }
}
