# Deploy mode C — single-container app (Django + Angular/nginx via supervisord).
# Postgres and Redis are NOT part of this stack — they run as separate/external
# containers. Point DATABASE_URL and REDIS_URL (in .env) at them: use a routable
# host/IP, or attach this stack to their docker network (see the networks note
# at the bottom). App on http://localhost:8080.
# `docker compose -f docker-compose.fullstack.yml up --build`
services:
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile.fullstack
    environment:
      DJANGO_ENV: production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-fullstack-secret-change-me-0123456789abcdef}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      # External Postgres / Redis — fail fast if not set in .env.
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to your external Postgres in .env}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL to your external Redis in .env}
      # Behind nginx on plain http locally → don't force Secure cookies/redirect.
      AUTH_COOKIE_SECURE: "0"
      SECURE_SSL_REDIRECT: "0"
      STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: /app/media
      GUNICORN_WORKERS: "3"
    volumes:
      - media:/app/media
    ports:
      - "8080:80"

volumes:
  media:
# If your external Postgres/Redis containers live on a named docker network,
# attach the app to it instead of using a routable IP, e.g.:
#   services:
#     app:
#       networks: [meterflow-data]
#   networks:
#     meterflow-data:
#       external: true
