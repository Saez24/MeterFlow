<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>MeterFlow – Zählerstände erfassen</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Persönlicher Energie- und Verbrauchsrechner für Strom, Gas, Wasser und mehr"
    />
    <meta name="theme-color" content="#4F46E5" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="app-icons/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="app-icons/apple-touch-icon.png" />
    <!-- Fonts are self-hosted (see src/styles/_fonts.scss) — no CDN. -->
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body class="light-theme">
    <!-- nginx replaces __CSP_NONCE__ with the per-request $request_id (sub_filter);
         Angular reads ngCspNonce and stamps it on all runtime-injected <style> tags,
         matching the CSP `style-src 'nonce-…'` (security-standards §7). -->
    <app-root ngCspNonce="__CSP_NONCE__"></app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
