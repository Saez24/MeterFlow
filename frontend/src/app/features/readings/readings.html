<div class="page-container">
  <div class="page-header">
    <div>
      <h1 class="page-title" i18n="@@readings.title">Ablesungen</h1>
      <p class="page-subtitle" i18n="@@readings.subtitle">Alle erfassten Zählerstände</p>
    </div>
    <button type="button" class="action-btn df-btn df-btn-primary" routerLink="new">
      <mat-icon>add</mat-icon>
      <span i18n="@@readings.addBtn">Ablesung erfassen</span>
    </button>
  </div>

  <!-- Filter -->
  <div class="filter-bar">
    <div class="df-field filter-select">
      <label for="rd-filter" i18n="@@readings.filter.label">Zähler filtern</label>
      <select
        id="rd-filter"
        class="df-select"
        [value]="filterMeterId()"
        (change)="filterMeterId.set($any($event.target).value)"
      >
        <option value="" i18n="@@readings.filter.all">Alle Zähler</option>
        @for (meter of meters(); track meter.id) {
          <option [value]="meter.id">{{ meter.name }}</option>
        }
      </select>
    </div>
  </div>

  @if (filteredReadings().length === 0) {
    <div class="empty-state">
      <mat-icon>history</mat-icon>
      <h3 i18n="@@readings.empty.title">Keine Ablesungen gefunden</h3>
      <p i18n="@@readings.empty.desc">Füge deine erste Ablesung hinzu.</p>
      <button type="button" class="df-btn df-btn-primary" routerLink="new">
        <span i18n="@@readings.empty.btn">Ablesung erfassen</span>
      </button>
    </div>
  }

  <app-readings-list
    [rows]="filteredReadings()"
    [showActions]="true"
    (deleteReading)="deleteReading($event)"
  />
</div>
