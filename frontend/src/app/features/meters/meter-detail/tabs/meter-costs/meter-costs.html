@if (meter(); as m) {
  @if (isLinkedGardenWater(m)) {
    <div class="linked-hint">
      <mat-icon>link</mat-icon>
      <span
        >Die Kosten dieses Gartenwasserzählers werden über den verknüpften Hauptwasserzähler
        abgerechnet. Eine eigene Kostenvorschau ist daher nicht nötig.</span
      >
    </div>
  } @else {
    <app-cost-preview [meter]="m"></app-cost-preview>
  }
}
