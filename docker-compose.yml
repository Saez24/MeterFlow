# Local app stack: Django API + Angular/nginx.
# Postgres and Redis are NOT part of this stack — they run as separate/external
# containers. Point DATABASE_URL and REDIS_URL (in .env) at them: use a routable
# host/IP, or attach this stack to their docker network (see the networks note
# at the bottom). App on http://localhost:8080.  `docker compose up --build`
services:
  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    environment:
      # development settings = no SSL redirect / non-secure cookies for local http
      DJANGO_ENV: development
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-dev-secret-change-me-0123456789abcdef}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      # External Postgres / Redis — fail fast if not set in .env.
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to your external Postgres in .env}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL to your external Redis in .env}
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      CSRF_TRUSTED_ORIGINS: http://localhost:8080
      STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: /app/media
    volumes:
      - media:/app/media

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  media:
# If your external Postgres/Redis containers live on a named docker network,
# attach the backend to it instead of using a routable IP, e.g.:
#   services:
#     backend:
#       networks: [meterflow-data]
#   networks:
#     meterflow-data:
#       external: true
